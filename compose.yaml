# Local deployment: browser/curl -> proxy (HTTPS) -> api (private network) -> SQLite volume.
services:
  api:
    build:
      context: .
      args:
        VERSION: ${APP_VERSION:-dev}
    image: ${IMAGE_REPO:-school-api}:${APP_VERSION:-dev}
    environment:
      DB_PATH: /data/school.db
      SEED_DATA: ${SEED_DATA:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - school-data:/data
    networks: [backend]            # not published to the host; only the proxy can reach it
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "/api", "-healthcheck"]
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 3

  proxy:
    image: caddy:2.10-alpine
    ports:
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [frontend, backend]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-q", "-O", "/dev/null", "https://localhost/readyz"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3

  # Helper used by backup/restore scripts: `docker compose run --rm tools ...`
  tools:
    image: alpine:3.21
    profiles: [tools]
    volumes:
      - school-data:/data
      - ./backups:/backups
    networks: []
    network_mode: none

networks:
  frontend:
  backend:
    internal: true                 # no outbound internet access for the api

volumes:
  school-data:
  caddy-data:
  caddy-config:
